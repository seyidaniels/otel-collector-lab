# `make validate LAB=NN` checks it parses; `make run LAB=NN` grades it.

receivers:
  # OTLP accepts gRPC and HTTP.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter goes first; batch goes last before exporters.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  batch:


exporters:
  # Explicitly configure and add debug to each pipeline.
  debug:
    verbosity: detailed
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp/prometheus:
    endpoint:  http://prometheus:9090
    tls:
      insecure: true
  file:
    path: /out/logs.jsonl

service:
  # Keep this block as is: the grader reads these self-metrics on :8888.
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    # Wire receivers → processors → exporters for each signal.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/prometheus, debug]
