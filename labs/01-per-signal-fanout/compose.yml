name: lab-01

services:
  otelcol:
    image: ${OTELCOL_IMAGE}
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/collector.yaml:ro
      - ./out:/out        # file exporter output appears in this lab's out/ folder
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"

networks:
  default:
    name: otel-lab
    external: true
