name: lab-05

services:
  otelcol:
    image: ${OTELCOL_IMAGE}
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/collector.yaml:ro
      - ./out/queue:/var/lib/otelcol/queue   # survives `docker restart` (and you can look inside)
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"

networks:
  default:
    name: otel-lab
    external: true
